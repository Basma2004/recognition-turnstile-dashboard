<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="100%" height="100%">
  <defs>
    <linearGradient id="kioskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C14"/>
      <stop offset="50%" stop-color="#0B1C16"/>
      <stop offset="100%" stop-color="#040D0A"/>
    </linearGradient>
    <radialGradient id="emeraldAura" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background Kiosk Feed Viewport -->
  <rect width="720" height="540" fill="url(#kioskBg)"/>
  <circle cx="360" cy="240" r="220" fill="url(#emeraldAura)"/>

  <!-- Optical Grid & Target Reticle -->
  <circle cx="360" cy="240" r="190" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="360" cy="240" r="130" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8,6" stroke-opacity="0.4"/>
  <circle cx="360" cy="240" r="60" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Person Silhouette approaching Kiosk -->
  <!-- Shoulders / Torso -->
  <path d="M 180 540 C 180 410, 240 370, 360 370 C 480 370, 540 410, 540 540 Z" fill="#0F2D24" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Head & Neck -->
  <rect x="330" y="320" width="60" height="70" rx="10" fill="#133E31"/>
  <ellipse cx="360" cy="230" rx="90" ry="115" fill="#1A4D3E" stroke="#34D399" stroke-width="2"/>

  <!-- Hair / Styling outline -->
  <path d="M 270 210 Q 360 110 450 210 Q 360 140 270 210 Z" fill="#0A241C"/>

  <!-- Glasses / Eyes simulation -->
  <rect x="295" y="200" width="50" height="30" rx="8" fill="none" stroke="#6EE7B7" stroke-width="2.5"/>
  <rect x="375" y="200" width="50" height="30" rx="8" fill="none" stroke="#6EE7B7" stroke-width="2.5"/>
  <line x1="345" y1="215" x2="375" y2="215" stroke="#6EE7B7" stroke-width="2"/>
  
  <circle cx="320" cy="215" r="5" fill="#34D399"/>
  <circle cx="400" cy="215" r="5" fill="#34D399"/>

  <!-- Nose & Smile lines -->
  <path d="M 360 220 L 354 255 L 366 255" fill="none" stroke="#6EE7B7" stroke-width="2" stroke-linecap="round"/>
  <path d="M 325 285 Q 360 310 395 285" fill="none" stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 68-Point Facial Landmarks Mesh (Connected Cyan/Green dots) -->
  <g fill="#10B981" stroke="#34D399" stroke-width="0.8" opacity="0.85">
    <!-- Jawline -->
    <circle cx="280" cy="240" r="3"/><circle cx="290" cy="280" r="3"/><circle cx="310" cy="315" r="3"/>
    <circle cx="340" cy="335" r="3"/><circle cx="360" cy="340" r="3.5"/><circle cx="380" cy="335" r="3"/>
    <circle cx="410" cy="315" r="3"/><circle cx="430" cy="280" r="3"/><circle cx="440" cy="240" r="3"/>
    <!-- Eyebrows -->
    <circle cx="300" cy="185" r="2.5"/><circle cx="320" cy="180" r="2.5"/><circle cx="340" cy="185" r="2.5"/>
    <circle cx="380" cy="185" r="2.5"/><circle cx="400" cy="180" r="2.5"/><circle cx="420" cy="185" r="2.5"/>
    <!-- Connections -->
    <line x1="320" y1="215" x2="360" y2="255" stroke-opacity="0.4"/>
    <line x1="400" y1="215" x2="360" y2="255" stroke-opacity="0.4"/>
    <line x1="360" y1="255" x2="360" y2="340" stroke-opacity="0.4"/>
  </g>

  <!-- DYNAMIC FACE BOUNDING BOX (#10B981) -->
  <g transform="translate(0, 0)">
    <!-- Box outline -->
    <rect x="250" y="95" width="220" height="260" rx="16" fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" stroke-width="2.5"/>
    
    <!-- Heavy Corner Brackets -->
    <path d="M 250 140 L 250 95 L 295 95" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
    <path d="M 425 95 L 470 95 L 470 140" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
    <path d="M 250 310 L 250 355 L 295 355" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
    <path d="M 425 355 L 470 355 L 470 310" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>

    <!-- Top Badge Pill -->
    <rect x="270" y="70" width="180" height="26" rx="6" fill="#10B981"/>
    <text x="360" y="87" fill="#022C22" font-family="JetBrains Mono, monospace" font-size="11" font-weight="bold" text-anchor="middle">
      MATCH: MARCUS VANCE (99.7%)
    </text>

    <!-- Bottom Latency Pill -->
    <rect x="290" y="365" width="140" height="24" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="360" y="381" fill="#34D399" font-family="JetBrains Mono, monospace" font-size="11" font-weight="bold" text-anchor="middle">
      ⚡ VERIFIED IN 1.8s
    </text>
  </g>

  <!-- Kiosk HUD Overlays -->
  <rect x="20" y="20" width="680" height="40" rx="8" fill="rgba(2, 44, 34, 0.85)" stroke="#10B981" stroke-width="1"/>
  <circle cx="40" cy="40" r="6" fill="#10B981"/>
  <text x="56" y="44" fill="#34D399" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold">GATE 01 - NORTH TURNSTILE</text>
  <text x="360" y="44" fill="#A7F3D0" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="middle">FPS: 60 · DLIB RESNET-128</text>
  <text x="680" y="44" fill="#10B981" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" text-anchor="end">READY ● ACTIVE</text>

  <!-- Gate Status Lower Banner -->
  <rect x="20" y="475" width="680" height="45" rx="10" fill="#10B981"/>
  <path d="M 50 497 L 65 512 L 100 477" fill="none" stroke="#022C22" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="504" fill="#022C22" font-family="Inter, sans-serif" font-size="15" font-weight="800">
    ACCESS GRANTED — TURNSTILE UNLOCKED
  </text>
  <text x="680" y="503" fill="#022C22" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" text-anchor="end">
    RELAY: ENGAGED [3.0s]
  </text>
</svg>
