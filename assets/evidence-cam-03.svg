<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bgGrad3)"/>

  <!-- Border grid -->
  <circle cx="320" cy="180" r="140" fill="none" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
  <circle cx="320" cy="180" r="90" fill="none" stroke="rgba(16,185,129,0.2)" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Face detection outline -->
  <rect x="230" y="80" width="180" height="190" rx="14" fill="rgba(30,41,59,0.6)" stroke="#10B981" stroke-width="2.5"/>
  
  <!-- Face features simulated -->
  <circle cx="280" cy="150" r="12" fill="#10B981" opacity="0.3"/>
  <circle cx="360" cy="150" r="12" fill="#10B981" opacity="0.3"/>
  <line x1="280" y1="180" x2="360" y2="180" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <path d="M 290 220 Q 320 240 350 220" fill="none" stroke="#10B981" stroke-width="2"/>

  <!-- Facial Landmark Mesh points -->
  <g fill="#34D399">
    <circle cx="260" cy="130" r="3"/>
    <circle cx="280" cy="125" r="3"/>
    <circle cx="300" cy="130" r="3"/>
    <circle cx="340" cy="130" r="3"/>
    <circle cx="360" cy="125" r="3"/>
    <circle cx="380" cy="130" r="3"/>
    <circle cx="320" cy="170" r="3"/>
    <circle cx="305" cy="195" r="3"/>
    <circle cx="335" cy="195" r="3"/>
    <circle cx="320" cy="250" r="3"/>
  </g>

  <!-- Turnstile Badge Tag -->
  <rect x="220" y="55" width="200" height="22" rx="4" fill="#10B981"/>
  <text x="320" y="70" fill="#022C22" font-family="JetBrains Mono, monospace" font-size="11" font-weight="bold" text-anchor="middle">GATE PASS: AUTHORIZED (99.4%)</text>

  <!-- CCTV Metadata Overlay -->
  <rect x="15" y="15" width="610" height="30" fill="rgba(15,23,42,0.85)" rx="4"/>
  <circle cx="32" cy="30" r="5" fill="#10B981"/>
  <text x="45" y="34" fill="#10B981" font-family="JetBrains Mono, monospace" font-size="11" font-weight="bold">ACCESS CLEAR ● GATE-NORTH-01</text>
  <text x="280" y="34" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">PERSON: MARCUS VANCE</text>
  <text x="450" y="34" fill="#F8FAFC" font-family="JetBrains Mono, monospace" font-size="11">1.4s MATCH</text>

  <!-- Bottom Info Bar -->
  <rect x="15" y="315" width="610" height="30" fill="rgba(16, 185, 129, 0.9)" rx="4"/>
  <text x="28" y="335" fill="#064E3B" font-family="Inter, sans-serif" font-size="12" font-weight="bold">CLEARED: Turnstile #1 facial verification synchronized with Screen Guard endpoint access</text>
</svg>
